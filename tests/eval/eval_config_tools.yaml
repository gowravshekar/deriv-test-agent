# Same metrics as eval_config.yaml. Use with tool-dataset.json (same cases
# as basic-dataset.json). Greeting / capital_lookup are not in this slice.
#
# This dataset contains time_query, whose answer is a live clock, so the
# reference-based final_response_match is replaced by tool_output_match.
metrics_to_run:
  - tool_use_quality
  - hallucination
  - final_response_quality
  - tool_output_match

custom_metrics:
  - name: tool_output_match
    custom_function_file: tool_output_match.py
